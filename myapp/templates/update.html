<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
        
            <h1>Update Page</h1>

            <label for="">Profile Image</label>
            <img style="width: 100px; height: 80px;" src="{{ data.profile.url }}" alt="">
            <input type="file" name = "profile" value="{{ data.profile.url }}"><br>
        
            <label for="full_name">Full Name</label>
            <input type="text" name="full_name" value="{{ data.full_name }}" id="full_name" placeholder="Enter your full name"><br>

            <label for="">Username</label>
            <input type="text" name="username" value="{{ data.username }}"><br>

            <label for="">Phone Number</label>
            <input type="number" name="number" value="{{ data.number }}"> <br>

            <label for="">Gender</label>
            <input type="radio" name="gender" value = "Male">Male
            <input type="radio" name="gender" value = "Female">Female <br>

            <label for="">DOB</label>
            <input type="date" name="dob" value="{{ data.dob|date:'Y-m-d' }}"> <br>

            <label for="">Email ID</label>
            <input type="email" name="email" value="{{ data.email }}"> <br>

            <label for="">Password</label>
            <input type="password" name="password"> <br>

            <label for="">Confirm Password</label>
            <input type="password" name="confirm_password"> <br>
        


            <button type="submit">Register</button>

    </form>
    </div>
    
</body>
</html>
